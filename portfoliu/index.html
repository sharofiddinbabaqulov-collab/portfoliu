<!DOCTYPE html>
<html lang="uz">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sharofiddin Babakulov — Portfolio</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400;700&family=Outfit:wght@300;500;700;800&display=swap"
    rel="stylesheet">
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    :root {
      --pk: #3b82f6;
      --pu: #7c5cff;
      --bd: #9f1239;
      --bg: #050a1f;
      --bg2: #0a1233
    }

    * {
      box-sizing: border-box
    }

    html {
      scroll-behavior: smooth
    }

    body {
      margin: 0;
      background: radial-gradient(ellipse at 0% 0%, rgba(159, 18, 57, .32), transparent 45%), radial-gradient(ellipse at 100% 100%, rgba(159, 18, 57, .28), transparent 45%), var(--bg);
      background-attachment: fixed;
      color: #dbe6ff;
      font-family: 'Outfit', sans-serif;
      overflow-x: hidden
    }

    .mono {
      font-family: 'JetBrains Mono', monospace
    }

    .disp {
      font-family: 'Space Grotesk', sans-serif
    }

    .grad {
      background: linear-gradient(90deg, var(--pk), var(--pu));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent
    }

    canvas#bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none
    }

    .scan {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background: repeating-linear-gradient(0deg, rgba(255, 255, 255, .015) 0 1px, transparent 1px 3px)
    }

    .glow {
      position: fixed;
      width: 420px;
      height: 420px;
      border-radius: 50%;
      pointer-events: none;
      z-index: 0;
      background: radial-gradient(circle, rgba(159, 18, 57, .22), transparent 65%);
      transform: translate(-50%, -50%)
    }

    .cut {
      clip-path: polygon(0 0, calc(100% - 14px) 0, 100% 14px, 100% 100%, 14px 100%, 0 calc(100% - 14px))
    }

    .btn {
      position: relative;
      padding: 16px 28px;
      font-family: 'JetBrains Mono', monospace;
      font-weight: 700;
      letter-spacing: .12em;
      font-size: 13px;
      text-transform: uppercase;
      display: inline-flex;
      gap: 10px;
      align-items: center;
      transition: .3s;
      cursor: pointer;
      border: 0
    }

    .btn-p {
      background: linear-gradient(90deg, var(--pk), var(--pu));
      color: #fff
    }

    .btn-p:hover {
      box-shadow: 0 0 40px rgba(59, 130, 246, .6);
      transform: translateY(-3px)
    }

    .btn-o {
      background: transparent;
      color: #fff;
      border: 1px solid var(--bd)
    }

    .btn-o:hover {
      background: rgba(159, 18, 57, .25);
      transform: translateY(-3px)
    }

    .reveal {
      opacity: 0;
      transform: translateY(50px);
      transition: 1s cubic-bezier(.2, .8, .2, 1)
    }

    .reveal.in {
      opacity: 1;
      transform: none
    }

    /* photo orbit */
    .orbit {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 1px dashed rgba(190, 18, 60, .7)
    }

    .spin {
      animation: spin 30s linear infinite
    }

    .spin-r {
      animation: spin 20s linear infinite reverse
    }

    .spin-s {
      animation: spin 50s linear infinite
    }

    @keyframes spin {
      to {
        transform: rotate(360deg)
      }
    }

    @keyframes float {

      0%,
      100% {
        transform: translateY(0)
      }

      50% {
        transform: translateY(-16px)
      }
    }

    @keyframes pulse2 {

      0%,
      100% {
        box-shadow: 0 0 30px rgba(59, 130, 246, .5)
      }

      50% {
        box-shadow: 0 0 80px rgba(124, 92, 255, .8)
      }
    }

    @keyframes blink {
      50% {
        opacity: 0
      }
    }

    .float {
      animation: float 6s ease-in-out infinite
    }

    .ring {
      background: conic-gradient(from 0deg, var(--pk), var(--pu), var(--bd), #38bdf8, var(--pk));
      animation: spin 8s linear infinite
    }

    .chip {
      position: absolute;
      padding: 8px 14px;
      background: rgba(20, 7, 38, .85);
      border: 1px solid rgba(190, 18, 60, .8);
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      backdrop-filter: blur(8px)
    }

    .card {
      background: linear-gradient(160deg, rgba(22, 24, 90, .6), rgba(6, 10, 38, .8));
      border: 1px solid rgba(159, 18, 57, .6);
      transition: .5s;
      position: relative;
      overflow: hidden
    }

    .card:hover {
      transform: translateY(-10px) rotateX(3deg);
      border-color: var(--pk);
      box-shadow: 0 20px 60px rgba(59, 130, 246, .25)
    }

    .card:before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(120deg, transparent 30%, rgba(255, 255, 255, .08) 50%, transparent 70%);
      transform: translateX(-100%);
      transition: .8s;
      z-index: 3;
      pointer-events: none
    }

    .card:hover:before {
      transform: translateX(100%)
    }

    .glass {
      background: linear-gradient(145deg, rgba(255, 255, 255, .11), rgba(255, 255, 255, .03));
      backdrop-filter: blur(18px) saturate(150%);
      -webkit-backdrop-filter: blur(18px) saturate(150%);
      border: 1px solid rgba(255, 255, 255, .2);
      box-shadow: 0 10px 40px rgba(0, 0, 0, .45), inset 0 1px 0 rgba(255, 255, 255, .3), 0 0 0 1px rgba(159, 18, 57, .4);
      transition: .5s;
      position: relative;
      overflow: hidden;
      cursor: pointer
    }

    .glass:hover {
      transform: translateY(-10px);
      box-shadow: 0 24px 70px rgba(59, 130, 246, .3), inset 0 1px 0 rgba(255, 255, 255, .4), 0 0 0 1px rgba(59, 130, 246, .7)
    }

    .glass:before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(120deg, transparent 30%, rgba(255, 255, 255, .12) 50%, transparent 70%);
      transform: translateX(-100%);
      transition: .9s;
      z-index: 5;
      pointer-events: none
    }

    .glass:hover:before {
      transform: translateX(100%)
    }

    .win {
      border: 1px solid rgba(255, 255, 255, .18);
      border-radius: 10px;
      overflow: hidden;
      background: rgba(5, 10, 31, .6)
    }

    .win-bar {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 10px;
      background: rgba(255, 255, 255, .07);
      border-bottom: 1px solid rgba(255, 255, 255, .12)
    }

    .win-bar i {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #9f1239
    }

    .win-bar i:nth-child(2) {
      background: #7c5cff
    }

    .win-bar i:nth-child(3) {
      background: #3b82f6
    }

    .win-bar span {
      margin-left: 8px;
      font-size: 10px;
      color: #a9b8e8;
      background: rgba(0, 0, 0, .3);
      padding: 3px 10px;
      border-radius: 99px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      flex: 1
    }

    .shot {
      height: 210px;
      overflow: hidden;
      position: relative;
    }

    .shot img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top;
      transition: transform 3s ease
    }

    .card:hover .shot img,
    .card:hover .mock {
      transform: translateY(-25%) scale(1.05)
    }

    .mock {
      position: absolute;
      inset: 0;
      transition: transform 3s ease;
      padding: 12px
    }

    .bar {
      display: flex;
      gap: 5px;
      margin-bottom: 10px
    }

    .bar i {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #3b82f6;
      opacity: .8
    }

    .skill {
      transition: .4s
    }

    .skill:hover {
      transform: translateY(-8px) scale(1.04);
      border-color: var(--pk)
    }

    .marquee {
      display: flex;
      gap: 48px;
      white-space: nowrap;
      animation: mq 25s linear infinite
    }

    @keyframes mq {
      to {
        transform: translateX(-50%)
      }
    }

    ::-webkit-scrollbar {
      width: 10px
    }

    ::-webkit-scrollbar-thumb {
      background: linear-gradient(var(--pk), var(--pu))
    }
  </style>
</head>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;
    const GITHUB = "https://github.com/sharofiddinbabaqulov-collab?tab=repositories";

    /* ====== Ma'lumotlar (shu yerni o'zgartirasiz) ====== */
    const SKILLS = [
      { n: "HTML", p: 95, i: "</>" }, { n: "CSS", p: 92, i: "{ }" },
      { n: "Tailwind CSS", p: 90, i: "~" }, { n: "JavaScript", p: 88, i: "JS" },
      { n: "React", p: 85, i: "⚛" }, { n: "C++", p: 60, i: "C+" },
      { n: "Python", p: 70, i: "Py" }, { n: "GitHub", p: 82, i: "Git" },
      { n: "Vercel", p: 80, i: "▲" },
    ];
    const PROJECTS = [
      { t: "Faster", d: "Men yaratgan loyiha. Bosing va ochib ko'ring.", tag: ["Loyiha", "Netlify"], url: "https://vermillion-sundae-067433.netlify.app/", live: true, c: ["#3b82f6", "#7c5cff"] },
      { t: "Usabel Place Market", d: "Onlayn do'kon: admin panel, mahsulot ranglari va yetkazib berish bilan.", tag: ["HTML", "Tailwind", "Vercel"], url: "https://usabelplace-market-jet.vercel.app/", live: true, c: ["#7c5cff", "#9f1239"] },
      { t: "Creative", d: "Men yaratgan zamonaviy sayt, Vercel'da deploy qilingan.", tag: ["React", "Vercel"], url: "https://creative-ten-phi.vercel.app/", live: true, c: ["#3b82f6", "#9f1239"] },
    ];

    /* ====== Hooks ====== */
    function useReveal() {
      useEffect(() => {
        const io = new IntersectionObserver(es => es.forEach(e => e.isIntersecting && e.target.classList.add("in")), { threshold: .15 });
        document.querySelectorAll(".reveal").forEach(el => io.observe(el));
        return () => io.disconnect();
      });
    }
    function useTyping(words) {
      const [txt, setTxt] = useState("");
      useEffect(() => {
        let w = 0, c = 0, del = false, t;
        const tick = () => {
          const word = words[w];
          setTxt(word.slice(0, c));
          if (!del && c === word.length) { del = true; t = setTimeout(tick, 1300); return }
          if (del && c === 0) { del = false; w = (w + 1) % words.length }
          c += del ? -1 : 1; t = setTimeout(tick, del ? 40 : 90);
        };
        tick(); return () => clearTimeout(t);
      }, []);
      return txt;
    }

    /* ====== Zarrachali fon ====== */
    function useParticles() {
      useEffect(() => {
        const cv = document.getElementById("bg"), x = cv.getContext("2d");
        let W, H, P = [], m = { x: -999, y: -999 }, id;
        const rs = () => { W = cv.width = innerWidth; H = cv.height = innerHeight; P = Array.from({ length: Math.min(110, W / 14) }, () => ({ x: Math.random() * W, y: Math.random() * H, vx: (Math.random() - .5) * .5, vy: (Math.random() - .5) * .5 })) };
        rs(); addEventListener("resize", rs);
        const mv = e => { m.x = e.clientX; m.y = e.clientY }; addEventListener("mousemove", mv);
        const loop = () => {
          x.clearRect(0, 0, W, H);
          P.forEach((p, i) => {
            p.x += p.vx; p.y += p.vy;
            if (p.x < 0 || p.x > W) p.vx *= -1; if (p.y < 0 || p.y > H) p.vy *= -1;
            x.fillStyle = i % 3 ? "rgba(59,130,246,.8)" : "rgba(190,18,60,.95)"; x.beginPath(); x.arc(p.x, p.y, 1.6, 0, 7); x.fill();
            for (let j = i + 1; j < P.length; j++) {
              const q = P[j], d = Math.hypot(p.x - q.x, p.y - q.y);
              if (d < 120) { x.strokeStyle = `rgba(124,92,255,${.25 * (1 - d / 120)})`; x.beginPath(); x.moveTo(p.x, p.y); x.lineTo(q.x, q.y); x.stroke() }
            }
            const dm = Math.hypot(p.x - m.x, p.y - m.y);
            if (dm < 160) { x.strokeStyle = `rgba(59,130,246,${.5 * (1 - dm / 160)})`; x.beginPath(); x.moveTo(p.x, p.y); x.lineTo(m.x, m.y); x.stroke() }
          });
          id = requestAnimationFrame(loop);
        };
        loop();
        return () => { cancelAnimationFrame(id); removeEventListener("resize", rs); removeEventListener("mousemove", mv) };
      }, []);
    }

    /* ====== Komponentlar ====== */
    function Cursor() {
      const r = useRef();
      useEffect(() => { const f = e => { if (r.current) { r.current.style.left = e.clientX + "px"; r.current.style.top = e.clientY + "px" } }; addEventListener("mousemove", f); return () => removeEventListener("mousemove", f) }, []);
      return <div ref={r} className="glow" />;
    }

    function Nav() {
      const [sc, setSc] = useState(false), [open, setOpen] = useState(false);
      useEffect(() => { const f = () => setSc(scrollY > 40); addEventListener("scroll", f); return () => removeEventListener("scroll", f) }, []);
      const L = [["Men haqimda", "about"], ["Skillar", "skills"], ["Loyihalar", "projects"], ["Aloqa", "contact"]];
      return (
        <header className={"fixed top-0 inset-x-0 z-50 transition-all " + (sc ? "bg-[#050a1f]/85 backdrop-blur-xl border-b border-[#9f1239]/50" : "")}>
          <div className="max-w-6xl mx-auto px-6 h-20 flex items-center justify-between">
            <a href="#top" className="flex items-center gap-3 disp font-bold text-xl">
              <span className="w-9 h-9 grid place-items-center cut" style={{ background: "linear-gradient(135deg,#3b82f6,#7c5cff,#9f1239)" }}>S</span>
              <span>Sharofiddin<span className="grad">.dev</span></span>
            </a>
            <nav className="hidden md:flex gap-8 mono text-xs tracking-[.2em] uppercase">
              {L.map(([a, b]) => <a key={b} href={"#" + b} className="hover:text-blue-400 transition">{a}</a>)}
            </nav>
            <a href={GITHUB} target="_blank" rel="noopener noreferrer" className="hidden md:block btn btn-o !py-3 cut">GitHub ↗</a>
            <button className="md:hidden text-2xl" onClick={() => setOpen(!open)}>☰</button>
          </div>
          {open && <div className="md:hidden bg-[#0a1233] px-6 pb-5 flex flex-col gap-4 mono text-sm">{L.map(([a, b]) => <a key={b} href={"#" + b} onClick={() => setOpen(false)}>{a}</a>)}</div>}
        </header>
      );
    }

    function Photo() {
      const [src, setSrc] = useState(window.PHOTO); // rasm index.html ichiga joylangan
      const [bad, setBad] = useState(false);
      const fileRef = useRef();
      const pick = e => { const f = e.target.files[0]; if (f) { setBad(false); setSrc(URL.createObjectURL(f)) } };
      return (
        <div className="relative w-[320px] h-[320px] sm:w-[440px] sm:h-[440px] mx-auto float">
          <div className="orbit spin-s" style={{ inset: "-40px" }}><i className="absolute -top-1.5 left-1/2 w-3 h-3 rounded-full bg-blue-500 shadow-[0_0_20px_#3b82f6]" /></div>
          <div className="orbit spin-r" style={{ inset: "-12px", borderColor: "rgba(159,18,57,.8)" }}><i className="absolute top-1/2 -right-1.5 w-3 h-3 rounded-full bg-violet-400 shadow-[0_0_20px_#7c5cff]" /></div>
          <div className="orbit spin" style={{ inset: "-75px", borderColor: "rgba(56,189,248,.25)" }}><i className="absolute bottom-6 left-6 w-2.5 h-2.5 rounded-full bg-sky-400" /></div>
          <div className="absolute inset-4 rounded-full ring p-[5px]" style={{ animation: "spin 8s linear infinite, pulse2 4s ease-in-out infinite" }}>
            <div className="w-full h-full rounded-full overflow-hidden bg-[#0a1233]" style={{ animation: "spin 8s linear infinite reverse" }}>
              {bad
                ? <button onClick={() => fileRef.current.click()} className="w-full h-full grid place-items-center text-center mono text-xs text-violet-300 px-10">📷<br />rasm.jpg qo'ying<br />yoki bosib tanlang</button>
                : <img src={src} alt="Sharofiddin" onError={() => setBad(true)} className="w-full h-full object-cover" style={{ objectPosition: "50% 15%" }} />}
            </div>
          </div>
          <input ref={fileRef} type="file" accept="image/*" className="hidden" onChange={pick} />
          <div className="chip" style={{ top: 10, left: -20, animation: "float 5s infinite" }}>&lt;React/&gt;</div>
          <div className="chip" style={{ top: 70, right: -30, animation: "float 6s infinite .5s" }}>Tailwind</div>
          <div className="chip" style={{ bottom: 60, left: -30, animation: "float 7s infinite 1s" }}>Python</div>
          <div className="chip" style={{ bottom: 10, right: 0, animation: "float 5.5s infinite 1.5s" }}>C++</div>
        </div>
      );
    }

    function Hero() {
      const t = useTyping(["Frontend dasturchi", "React developer", "UI animatsiya ustasi", "IT mutaxassis"]);
      return (
        <section id="top" className="relative z-10 min-h-screen flex items-center pt-24 pb-16">
          <div className="max-w-6xl mx-auto px-6 grid md:grid-cols-2 gap-16 items-center w-full">
            <div>
              <div className="mono text-xs tracking-[.3em] text-blue-400 flex items-center gap-3 mb-6"><span className="w-12 h-px bg-blue-500" />SHAXSIY PORTFOLIO</div>
              <h1 className="disp font-bold leading-[1.02] text-5xl sm:text-7xl">Salom, men <span className="grad">Sharofiddin</span> Babakulov</h1>
              <div className="mt-6 text-2xl sm:text-3xl font-medium">Men — <span className="grad">{t}</span><span style={{ animation: "blink 1s infinite" }} className="text-blue-500">|</span></div>
              <p className="mt-6 text-lg text-violet-200/70 max-w-lg font-light">IT sohasida frontend mutaxassisiman. Zamonaviy, tez va jonli veb-saytlarni React, Tailwind CSS va JavaScript bilan yarataman.</p>
              <div className="mt-10 flex flex-wrap gap-4">
                <a href="#projects" className="btn btn-p cut">Loyihalarni ko'rish →</a>
                <a href={GITHUB} target="_blank" rel="noopener noreferrer" className="btn btn-o cut">GitHub ↗</a>
              </div>
              <div className="mt-12 grid grid-cols-3 gap-4 max-w-md">
                {[["9+", "Texnologiya"], ["6+", "Loyiha"], ["24/7", "Kod yozish"]].map(([a, b]) => (
                  <div key={b} className="border-l-2 border-blue-500 pl-4"><div className="disp text-3xl font-bold">{a}</div><div className="mono text-[10px] tracking-widest text-violet-300/60 uppercase">{b}</div></div>))}
              </div>
            </div>
            <Photo />
          </div>
        </section>
      );
    }

    function Marquee() {
      const w = ["HTML", "CSS", "TAILWIND", "JAVASCRIPT", "REACT", "C++", "PYTHON", "GITHUB", "VERCEL"];
      const all = [...w, ...w, ...w, ...w];
      return <div className="relative z-10 border-y border-[#9f1239]/50 py-5 overflow-hidden bg-[#1c0715]/70">
        <div className="marquee disp text-2xl font-bold">{all.map((x, i) => <span key={i} className={i % 2 ? "grad" : "text-violet-200/40"}>{x} <span className="text-blue-500">✦</span></span>)}</div></div>;
    }

    function Title({ k, t }) { return <div className="reveal mb-14"><div className="mono text-xs tracking-[.3em] text-blue-400 mb-3">// {k}</div><h2 className="disp text-4xl sm:text-6xl font-bold">{t}</h2></div> }

    function About() {
      return (
        <section id="about" className="relative z-10 py-28">
          <div className="max-w-6xl mx-auto px-6">
            <Title k="01 — MEN HAQIMDA" t={<>Men <span className="grad">kimman?</span></>} />
            <div className="grid md:grid-cols-2 gap-10">
              <div className="reveal text-lg text-violet-100/75 leading-relaxed space-y-5">
                <p>Men <b className="text-white">Babakulov Sharofiddin</b> — IT sohasida ishlayman, asosiy yo'nalishim <b className="text-blue-400">frontend</b>.</p>
                <p>Menga chiroyli dizayn va jonli animatsiyalar yoqadi. Har bir sahifani odamlar ko'rib hayratlansin deb yarataman.</p>
                <p>Hozir HTML, CSS, Tailwind CSS, JavaScript va React bilan ishlayman, shuningdek C++ va Python ham o'rganganman. Loyihalarimni GitHub va Vercel orqali joylayman.</p>
              </div>
              <div className="reveal cut border border-[#9f1239]/70 bg-black/40 p-6 mono text-sm leading-7">
                <div className="flex gap-2 mb-4">{["#ff5f56", "#ffbd2e", "#27c93f"].map(c => <i key={c} className="w-3 h-3 rounded-full" style={{ background: c }} />)}</div>
                <div><span className="text-blue-400">const</span> men = {"{"}</div>
                <div className="pl-5">ism: <span className="text-green-300">"Sharofiddin Babakulov"</span>,</div>
                <div className="pl-5">soha: <span className="text-green-300">"IT — Frontend"</span>,</div>
                <div className="pl-5">stack: [<span className="text-green-300">"React"</span>, <span className="text-green-300">"Tailwind"</span>, <span className="text-green-300">"JS"</span>],</div>
                <div className="pl-5">hostingda: <span className="text-green-300">"Vercel"</span>,</div>
                <div className="pl-5">tayyor: <span className="text-violet-400">true</span></div>
                <div>{"}"};</div>
              </div>
            </div>
          </div>
        </section>
      );
    }

    function Skills() {
      const [go, setGo] = useState(false); const r = useRef();
      useEffect(() => { const io = new IntersectionObserver(e => e[0].isIntersecting && setGo(true), { threshold: .2 }); io.observe(r.current); return () => io.disconnect() }, []);
      return (
        <section id="skills" className="relative z-10 py-28 bg-[#1c0715]/60">
          <div className="max-w-6xl mx-auto px-6" ref={r}>
            <Title k="02 — MY SKILLS" t={<>My <span className="grad">Skills</span></>} />
            <div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-6">
              {SKILLS.map((s, i) => (
                <div key={s.n} className="reveal skill cut border border-[#9f1239]/60 bg-black/30 p-6" style={{ transitionDelay: i * 80 + "ms" }}>
                  <div className="flex items-center justify-between mb-5">
                    <div className="w-12 h-12 grid place-items-center cut mono font-bold" style={{ background: "linear-gradient(135deg,#3b82f6,#7c5cff)" }}>{s.i}</div>
                    <span className="mono text-sm text-blue-400">{go ? s.p : 0}%</span>
                  </div>
                  <div className="disp text-xl font-bold mb-3">{s.n}</div>
                  <div className="h-1.5 bg-violet-900/50 rounded overflow-hidden"><div className="h-full rounded" style={{ width: go ? s.p + "%" : "0%", transition: "width 1.6s cubic-bezier(.2,.8,.2,1) " + (i * .1) + "s", background: "linear-gradient(90deg,#3b82f6,#7c5cff)", boxShadow: "0 0 12px #3b82f6" }} /></div>
                </div>))}
            </div>
          </div>
        </section>
      );
    }

    function ProjectCard({ p, i, onOpen }) {
      const box = useRef(); const [sc, setSc] = useState(.28);
      useEffect(() => {
        if (!box.current) return;
        const f = () => setSc(box.current.clientWidth / 1280); f();
        const ro = new ResizeObserver(f); ro.observe(box.current); return () => ro.disconnect();
      }, []);
      const [a, b] = p.c;
      const host = p.url.replace(/^https?:\/\//, "").replace(/\/$/, "");
      return (
        <a href={p.url} target="_blank" rel="noopener noreferrer" className="reveal glass group cut block" style={{ transitionDelay: (i % 3) * 120 + "ms" }}>
          <div className="p-3">
            <div className="win">
              <div className="win-bar"><i /><i /><i /><span className="mono">{host}</span></div>
              <div ref={box} className="shot">
                <div className="mock" style={{ background: `linear-gradient(135deg,${a}44,${b}44),#050a1f` }}>
                  <div className="h-5 w-2/3 rounded mb-3" style={{ background: `linear-gradient(90deg,${a},${b})` }} />
                  <div className="h-2 w-full bg-white/10 rounded mb-2" /><div className="h-2 w-5/6 bg-white/10 rounded mb-5" />
                  <div className="grid grid-cols-3 gap-2 mb-4">{[0, 1, 2].map(k => <div key={k} className="h-14 rounded" style={{ background: `linear-gradient(160deg,${a}66,${b}22)`, border: "1px solid " + a + "55" }} />)}</div>
                  <div className="h-20 rounded" style={{ background: `radial-gradient(circle at 30% 40%,${a}77,transparent 60%)` }} />
                </div>
                {p.live && <iframe src={p.url} title={p.t} loading="lazy" tabIndex={-1}
                  style={{ position: "absolute", top: 0, left: 0, width: 1280, height: 900, border: 0, transformOrigin: "0 0", transform: `scale(${sc})`, pointerEvents: "none", background: "#fff" }} />}
                <div className="absolute inset-0 z-[2] bg-gradient-to-t from-[#050a1f]/60 via-transparent to-transparent" />
              </div>
            </div>
          </div>
          <div className="px-6 pb-6 pt-2">
            <div className="flex gap-2 mb-3 flex-wrap">{p.tag.map(t => <span key={t} className="mono text-[10px] tracking-widest uppercase px-2 py-1 border border-[#be123c]/80 text-rose-300">{t}</span>)}</div>
            <h3 className="disp text-2xl font-bold mb-2">{p.t}</h3>
            <p className="text-violet-100/70 text-[15px] leading-relaxed">{p.d}</p>
            <span className="inline-flex items-center gap-2 mt-5 mono text-xs tracking-widest uppercase text-blue-300 group-hover:text-white">Loyihani ochish ↗</span>
          </div>
        </a>
      );
    }

    function Viewer({ p, onClose }) {
      useEffect(() => {
        const k = e => e.key === "Escape" && onClose();
        addEventListener("keydown", k); document.body.style.overflow = "hidden";
        return () => { removeEventListener("keydown", k); document.body.style.overflow = "" };
      }, []);
      return (
        <div className="fixed inset-0 z-[100] flex flex-col" style={{ background: "rgba(5,10,31,.88)", backdropFilter: "blur(14px)" }}>
          <div className="flex items-center gap-3 px-4 sm:px-6 h-16 border-b border-[#9f1239]/60 bg-black/40">
            <span className="disp font-bold text-lg truncate">{p.t}</span>
            <span className="mono text-[11px] text-blue-300/80 truncate hidden sm:block">{p.url}</span>
            <div className="ml-auto flex gap-3">
              {p.live && <a href={p.url} target="_blank" rel="noopener noreferrer" className="btn btn-o !py-2 !px-4 !text-[11px] cut">Yangi oynada ↗</a>}
              <button onClick={onClose} className="btn btn-p !py-2 !px-4 !text-[11px] cut">✕ Yopish</button>
            </div>
          </div>
          <div className="flex-1 relative">
            {p.live
              ? <iframe src={p.url} title={p.t} className="absolute inset-0 w-full h-full border-0 bg-white" />
              : <div className="h-full grid place-items-center text-center px-6"><div><div className="text-5xl mb-4">🚀</div><div className="disp text-2xl font-bold mb-2">{p.t}</div><p className="text-violet-200/70 max-w-sm">Bu loyihaning jonli sayt havolasi hali qo'shilmagan.</p></div></div>}
          </div>
        </div>
      );
    }

    function Projects() {
      const [cur, setCur] = useState(null);
      return (
        <section id="projects" className="relative z-10 py-28">
          <div className="max-w-6xl mx-auto px-6">
            <Title k="03 — LOYIHALAR" t={<>Men qilgan <span className="grad">loyihalar</span></>} />
            <div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-8">{PROJECTS.map((p, i) => <ProjectCard key={p.t} p={p} i={i} onOpen={setCur} />)}</div>
            <div className="reveal mt-16 text-center cut border border-[#9f1239]/70 bg-gradient-to-br from-[#9f1239]/15 to-blue-500/10 p-12">
              <div className="mono text-xs tracking-[.3em] text-blue-400 mb-3">YANA KO'PROQ</div>
              <h3 className="disp text-3xl sm:text-4xl font-bold mb-6">Barcha loyihalarim <span className="grad">GitHub</span> da</h3>
              <a href={GITHUB} target="_blank" rel="noopener noreferrer" className="btn btn-p cut">GitHub ga o'tish ↗</a>
            </div>
          </div>

        </section>
      );
    }

    function Contact() {
      return (
        <section id="contact" className="relative z-10 py-28 bg-[#1c0715]/60">
          <div className="max-w-3xl mx-auto px-6 text-center reveal">
            <div className="mono text-xs tracking-[.3em] text-blue-400 mb-3">// 04 — ALOQA</div>
            <h2 className="disp text-4xl sm:text-6xl font-bold mb-6">Keling, birga <span className="grad">yaratamiz</span></h2>
            <p className="text-violet-100/70 text-lg mb-10">Loyiha yoki hamkorlik bo'yicha yozing — sayt, bot yoki dizayn bo'lsin, tayyorman.</p>
            <div className="flex justify-center gap-4 flex-wrap">
              <a href={GITHUB} target="_blank" rel="noopener noreferrer" className="btn btn-p cut">GitHub ↗</a>
              <a href="#top" className="btn btn-o cut">Yuqoriga ↑</a>
            </div>
          </div>
        </section>
      );
    }

    function App() {
      useParticles(); useReveal();
      return (<>
        <Cursor /><Nav /><Hero /><Marquee /><About /><Skills /><Projects /><Contact />
        <footer className="relative z-10 text-center py-8 mono text-xs text-violet-300/50 border-t border-[#9f1239]/50">© 2026 Sharofiddin Babakulov · React + Tailwind</footer>
      </>);
    }
    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
